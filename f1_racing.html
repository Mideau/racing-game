<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F1 MINIMAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace;color:#fff;overflow:hidden}
#wrap{position:relative;user-select:none}
canvas{display:block}
#hud{position:absolute;top:14px;left:14px;font-size:13px;line-height:2.1;pointer-events:none;text-shadow:1px 1px 4px rgba(0,0,0,.9)}
#spd{font-size:26px;color:#ff2222;font-weight:bold;line-height:1.3}
#spd span{font-size:14px;font-weight:normal;color:#cc4444}
#drsd{font-size:15px;letter-spacing:1px}
.dim{color:#666}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#overlay h1{font-size:64px;color:#ff2222;letter-spacing:14px;text-shadow:0 0 40px rgba(255,34,34,.4)}
.sub{font-size:16px;color:#aaa;letter-spacing:6px}
.hint{font-size:12px;color:#555;letter-spacing:2px}
#overlay button{margin-top:8px;padding:14px 56px;background:#ff2222;color:#fff;border:none;font:bold 15px 'Courier New';letter-spacing:5px;cursor:pointer;transition:background .15s}
#overlay button:hover{background:#bb0000}
#ctrls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#3a3a3a;white-space:nowrap;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1200" height="750"></canvas>
  <div id="hud">
    <div id="spd">0 <span>KM/H</span></div>
    <div id="drsd" class="dim">DRS &nbsp;—</div>
    <div id="lapd" class="dim">LAP &nbsp; 1 / 3</div>
    <div id="timed">TIME &nbsp;—</div>
    <div id="bestd" class="dim">BEST &nbsp;—</div>
    <div id="posd">POS &nbsp;&nbsp;P1</div>
  </div>
  <div id="overlay">
    <h1>F1</h1>
    <div class="sub">MINIMAL RACING</div>
    <div class="hint">3 LAPS &nbsp;·&nbsp; BEAT THE AI &nbsp;·&nbsp; HOLD SPACE FOR DRS</div>
    <button onclick="startRace()">RACE</button>
  </div>
  <div id="ctrls">W / ↑ ACCELERATE &nbsp; S / ↓ BRAKE &nbsp; A← D→ STEER &nbsp; SPACE DRS</div>
</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;

// ── WORLD & CAMERA ────────────────────────────────────────────────────────────
const WORLD_W = 3400, WORLD_H = 1200;
let camX = 600, camY = 400;

// ── TRACK ─────────────────────────────────────────────────────────────────────
const TW = 190; // very wide track

// Massive circuit — world coordinates.
// Clockwise. Last point = first (closes the loop).
const TP = [
  {x: 460,  y: 260},   //  0  start / finish line
  {x: 2780, y: 260},   //  1  ← end of MASSIVE 2320 px front straight
  {x: 2920, y: 295},   //  2  T1 entry
  {x: 2990, y: 400},   //  3  T1 apex
  {x: 3020, y: 560},   //  4  right-side straight
  {x: 2990, y: 720},   //  5  T2 entry
  {x: 2900, y: 820},   //  6  T2 apex
  {x: 2760, y: 880},   //  7  T2 exit
  {x: 2400, y: 920},   //  8  long back straight begins
  {x: 2000, y: 945},   //  9
  {x: 1600, y: 960},   // 10
  {x: 1200, y: 950},   // 11
  {x: 880,  y: 925},   // 12  chicane zone
  {x: 740,  y: 960},   // 13  chicane bump left
  {x: 640,  y: 935},   // 14  chicane apex
  {x: 530,  y: 958},   // 15  chicane bump right
  {x: 390,  y: 920},   // 16  left hairpin entry
  {x: 270,  y: 850},   // 17
  {x: 190,  y: 750},   // 18  hairpin apex
  {x: 195,  y: 630},   // 19  hairpin exit
  {x: 250,  y: 520},   // 20  climbing back up
  {x: 320,  y: 410},   // 21  final sector
  {x: 390,  y: 320},   // 22
  {x: 460,  y: 260},   // 23  close
];
const NWP = TP.length - 1;

// ── PATH HELPERS ──────────────────────────────────────────────────────────────
// Draw smooth path through TP (world space — apply camera translate first)
function tracePath() {
  ctx.beginPath();
  ctx.moveTo((TP[0].x+TP[1].x)/2, (TP[0].y+TP[1].y)/2);
  for (let i=1; i<TP.length-1; i++)
    ctx.quadraticCurveTo(TP[i].x, TP[i].y,
      (TP[i].x+TP[i+1].x)/2, (TP[i].y+TP[i+1].y)/2);
  ctx.closePath();
}

// On-track check (world coords, segment distance)
function onTrack(x, y) {
  const r = TW * 0.5;
  for (let i=0; i<TP.length-1; i++) {
    const ax=TP[i].x, ay=TP[i].y, bx=TP[i+1].x, by=TP[i+1].y;
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    if (!l2) continue;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/l2));
    const nx=ax+t*dx-x, ny=ay+t*dy-y;
    if (nx*nx+ny*ny < r*r) return true;
  }
  return false;
}

// ── CAR ───────────────────────────────────────────────────────────────────────
const TOTAL_LAPS = 3;
const SPD_MULT   = 62;   // px/frame → displayed km/h
const MAX_SPD    = 5.0;
const DRS_BONUS  = 0.46; // ≈ +28 km/h at full charge

let cars=[], player, gameRunning=false, finishOrder=[];
let raceStartTime=0;

class Car {
  constructor(x, y, angle, color, isPlayer) {
    this.x=x; this.y=y; this.angle=angle; this.spd=0;
    this.color=color; this.isPlayer=isPlayer;
    this.lap=1; this.lapT=0; this.bestLap=Infinity;
    this.checkpoint=false; this.finished=false;
    this.aiWp=1;
    this.drsLevel=0;
    this.trail=[];
  }

  update(K) {
    if (this.finished) { this.spd*=0.95; this._move(); return; }

    if (this.isPlayer) {
      const up  = K.ArrowUp  ||K.w||K.W;
      const dn  = K.ArrowDown||K.s||K.S;
      const lt  = K.ArrowLeft||K.a||K.A;
      const rt  = K.ArrowRight||K.d||K.D;
      const drs = K[' '];
      const grip = Math.min(this.spd/3.5, 1);

      if (up) this.spd = Math.min(this.spd+0.10, MAX_SPD);
      else if (dn) this.spd = Math.max(this.spd*0.88, 0);
      else this.spd *= 0.979;

      // DRS — builds progressively, pushes past normal cap
      if (drs && this.spd > 1.5) this.drsLevel = Math.min(1, this.drsLevel+0.028);
      else                        this.drsLevel = Math.max(0, this.drsLevel-0.022);
      if (this.drsLevel > 0) {
        const top = MAX_SPD + this.drsLevel*DRS_BONUS;
        this.spd  = Math.min(this.spd + this.drsLevel*0.045, top);
      }

      if (lt) this.angle -= 0.044*grip;
      if (rt) this.angle += 0.044*grip;

      if (!onTrack(this.x,this.y) && this.spd>1) {
        this.trail.push({x:this.x,y:this.y,a:0.45});
        if (this.trail.length>180) this.trail.shift();
      }
    } else {
      // AI waypoint follower
      const tgt=TP[this.aiWp];
      const dx=tgt.x-this.x, dy=tgt.y-this.y;
      let da=Math.atan2(dy,dx)-this.angle;
      while(da> Math.PI) da-=2*Math.PI;
      while(da<-Math.PI) da+=2*Math.PI;
      this.angle += Math.sign(da)*Math.min(Math.abs(da),0.035);
      const ms = this.color==='#0099ff'?3.6:3.3;
      this.spd  = Math.min(this.spd+0.08, ms);
      if (Math.hypot(dx,dy)<32) this.aiWp=(this.aiWp+1)%NWP;
    }

    // Off-track: absolute minimum penalty
    if (!onTrack(this.x,this.y)) this.spd *= 0.998;
    this.spd = Math.max(0, this.spd);
    this._move();
    this._checkFinish();
  }

  _move() {
    this.x += Math.cos(this.angle)*this.spd;
    this.y += Math.sin(this.angle)*this.spd;
    this.x  = Math.max(10, Math.min(WORLD_W-10, this.x));
    this.y  = Math.max(10, Math.min(WORLD_H-10, this.y));
  }

  _checkFinish() {
    // Checkpoint deep in back straight
    if (this.y>895 && this.x>900 && this.x<2200) this.checkpoint=true;

    // Finish line at x=490, front straight y≈260
    const px=this.x-Math.cos(this.angle)*this.spd;
    if (px<490 && this.x>=490 && this.y>235 && this.y<287
        && Math.cos(this.angle)>0.45 && this.checkpoint) {
      if (this.lapT>0) {
        const lt=performance.now()-this.lapT;
        if (lt<this.bestLap) this.bestLap=lt;
      }
      this.lapT=performance.now();
      this.checkpoint=false;
      this.lap++;
      if (this.lap>TOTAL_LAPS) {
        this.lap=TOTAL_LAPS; this.finished=true;
        if (!finishOrder.includes(this)) finishOrder.push(this);
      }
    }
  }

  get progress() {
    let md=Infinity, ci=0;
    for (let i=0;i<NWP;i++) {
      const d=Math.hypot(this.x-TP[i].x,this.y-TP[i].y);
      if (d<md){md=d;ci=i;}
    }
    return this.lap*1000+ci-md/100;
  }

  draw() {
    // Skid trail (world space)
    for (const t of this.trail) {
      ctx.fillStyle=`rgba(70,50,10,${t.a*0.1})`;
      ctx.fillRect(t.x-2,t.y-2,4,4);
      t.a*=0.94;
    }
    this.trail=this.trail.filter(t=>t.a>0.01);

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    const L=24,W2=11;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(-L/2+2,-W2/2+2,L+8,W2+3);

    // Body
    ctx.fillStyle=this.color;
    ctx.fillRect(-L/2,-W2/2,L,W2);

    // DRS glow
    if (this.isPlayer && this.drsLevel>0.08) {
      ctx.shadowColor='#00ff88';
      ctx.shadowBlur=8*this.drsLevel;
      ctx.strokeStyle=`rgba(0,255,136,${this.drsLevel*0.65})`;
      ctx.lineWidth=2.5;
      ctx.strokeRect(-L/2-1,-W2/2-1,L+2,W2+2);
      ctx.shadowBlur=0;
    }

    // Wings
    ctx.fillStyle=this.color;
    ctx.fillRect(L/2-1,-W2/2-4,3,W2+8);
    ctx.fillRect(-L/2-2,-W2/2-2,3,W2+4);

    // Pod shading
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.fillRect(-4,-W2/2,11,3);
    ctx.fillRect(-4,W2/2-3,11,3);

    // Cockpit
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(3,0,6,3.8,0,0,Math.PI*2);
    ctx.fill();

    // Wheels
    ctx.fillStyle='#111';
    for (const [wx,wy,wl,wh] of [[-6,-W2/2-3,7,4.5],[6,-W2/2-3,7,4.5],[-6,W2/2-1.5,7,4.5],[6,W2/2-1.5,7,4.5]])
      ctx.fillRect(wx-wl/2,wy,wl,wh);

    ctx.restore();
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
const K={};
window.addEventListener('keydown',e=>{
  K[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup',e=>{K[e.key]=false;});

// ── WORLD DRAWING ─────────────────────────────────────────────────────────────
function drawWorld() {
  // Background (grass) — only visible area
  const vl=camX-W/2-20, vt=camY-H/2-20;
  ctx.fillStyle='#1d3d1d';
  ctx.fillRect(vl-20, vt-20, W+60, H+60);

  // Grass stripe texture
  ctx.strokeStyle='rgba(0,0,0,0.09)';
  ctx.lineWidth=1;
  const sy=Math.floor(vt/22)*22;
  for(let y=sy;y<vt+H+40;y+=22){
    ctx.beginPath();ctx.moveTo(vl,y);ctx.lineTo(vl+W+40,y);ctx.stroke();
  }

  ctx.lineCap='round';
  ctx.lineJoin='round';

  // Curb border (white edge)
  ctx.strokeStyle='#ddd';
  ctx.lineWidth=TW+20;
  tracePath(); ctx.stroke();

  // Tarmac
  ctx.strokeStyle='#464646';
  ctx.lineWidth=TW;
  tracePath(); ctx.stroke();

  // Tarmac sheen
  ctx.strokeStyle='rgba(255,255,255,0.025)';
  ctx.lineWidth=TW-8;
  tracePath(); ctx.stroke();

  // Centre line dashes
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=3;
  ctx.setLineDash([34,30]);
  tracePath(); ctx.stroke();
  ctx.setLineDash([]);

  drawKerbs();
  drawFinishLine();
}

function drawKerbs() {
  const segs=[1,2,3,5,6,13,14,15,17,18,19];
  for (const si of segs) {
    if (!TP[si+1]) continue;
    const a=TP[si],b=TP[si+1];
    const steps=16;
    for(let t=0;t<steps;t++){
      const f=t/steps;
      const mx=a.x+(b.x-a.x)*f, my=a.y+(b.y-a.y)*f;
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
      const nx=-dy/len, ny=dx/len;
      ctx.fillStyle=t%2===0?'#cc0000':'#ffffff';
      for(const s of[-1,1]){
        const ox=mx+nx*TW*.5*s, oy=my+ny*TW*.5*s;
        ctx.fillRect(ox-5,oy-2.5,10,5);
      }
    }
  }
}

function drawFinishLine() {
  // At x=484, front straight y=260, vertical checkered strip
  const fx=478, fy=260, sz=11;
  const y1=fy-TW/2+5, y2=fy+TW/2-5;
  const rows=Math.ceil((y2-y1)/sz);
  for(let r=0;r<rows;r++)
    for(let c=0;c<2;c++){
      ctx.fillStyle=(r+c)%2===0?'#fff':'#000';
      ctx.fillRect(fx+c*sz,y1+r*sz,sz,sz);
    }
}

// ── MINIMAP ───────────────────────────────────────────────────────────────────
// Bounding box of track
const MM_WX=130, MM_WY=240, MM_EX=3030, MM_EY=975;
const MM_W=240, MM_H=72;
const MM_SX=MM_W/(MM_EX-MM_WX), MM_SY=MM_H/(MM_EY-MM_WY);
const MM_PX=W-MM_W-12, MM_PY=H-MM_H-12;

function toMM(wx,wy){
  return {x:MM_PX+(wx-MM_WX)*MM_SX, y:MM_PY+(wy-MM_WY)*MM_SY};
}

function drawMinimap() {
  // Background
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(MM_PX-5,MM_PY-5,MM_W+10,MM_H+10);

  // Track outline on minimap
  ctx.strokeStyle='#555';
  ctx.lineWidth=5;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.beginPath();
  const s=toMM(TP[0].x,TP[0].y);
  ctx.moveTo(s.x,s.y);
  for(const p of TP){ const m=toMM(p.x,p.y); ctx.lineTo(m.x,m.y);}
  ctx.stroke();

  // Finish line marker
  const fm=toMM(478,260);
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(fm.x,fm.y-4);ctx.lineTo(fm.x,fm.y+4);
  ctx.stroke();

  // Cars on minimap
  for(const car of cars){
    const m=toMM(car.x,car.y);
    ctx.beginPath();
    ctx.arc(m.x,m.y,car.isPlayer?4:3,0,Math.PI*2);
    ctx.fillStyle=car.color;
    ctx.fill();
  }

  // Label
  ctx.fillStyle='#444';
  ctx.font='10px Courier New';
  ctx.fillText('MAP',MM_PX+2,MM_PY-7);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function fmtTime(ms){
  if(!ms||ms===Infinity||ms<=0) return '—';
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000).toString().padStart(2,'0');
  const t=Math.floor(ms%1000).toString().padStart(3,'0');
  return `${m}:${s}.${t}`;
}

function updateHUD(){
  const kmh=Math.round(player.spd*SPD_MULT);
  document.getElementById('spd').innerHTML=`${kmh} <span>KM/H</span>`;

  const dl=player.drsLevel;
  const dEl=document.getElementById('drsd');
  if(dl>0.05){
    const col=dl>0.75?'#00ff88':dl>0.35?'#aaff44':'#ffcc00';
    dEl.innerHTML=`DRS <span style="color:${col}">▶ +${Math.round(dl*28)} KM/H</span>`;
  } else {
    dEl.innerHTML=`<span class="dim">DRS &nbsp;—</span>`;
  }

  document.getElementById('lapd').textContent=`LAP   ${Math.min(player.lap,TOTAL_LAPS)} / ${TOTAL_LAPS}`;
  const el=player.lapT>0?performance.now()-player.lapT:performance.now()-raceStartTime;
  document.getElementById('timed').textContent=`TIME  ${fmtTime(el)}`;
  document.getElementById('bestd').textContent=`BEST  ${fmtTime(player.bestLap)}`;
  const pos=[...cars].sort((a,b)=>b.progress-a.progress).indexOf(player)+1;
  document.getElementById('posd').textContent=`POS   P${pos}`;
}

// ── GAME FLOW ─────────────────────────────────────────────────────────────────
function startRace(){
  document.getElementById('overlay').style.display='none';
  cars=[]; finishOrder=[];

  player    =new Car(560,252,0,'#ff2222',true);
  const ai1 =new Car(525,252,0,'#ffcc00',false);
  const ai2 =new Car(490,252,0,'#0099ff',false);
  ai1.aiWp=1; ai2.aiWp=1;
  cars=[ai2,ai1,player];

  camX=player.x; camY=player.y;
  gameRunning=true;
  raceStartTime=performance.now();
  for(const car of cars) car.lapT=raceStartTime;
  requestAnimationFrame(loop);
}

function showFinish(){
  const pos=finishOrder.indexOf(player)+1;
  const medals=['1ST 🏆','2ND 🥈','3RD 🥉'];
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h1>FINISH</h1>
    <div class="sub">${medals[pos-1]||pos+'TH'} PLACE</div>
    <div style="font-size:14px;color:#ccc">BEST LAP &nbsp; ${fmtTime(player.bestLap)}</div>
    <div class="hint" style="margin-top:4px">TOTAL TIME &nbsp; ${fmtTime(performance.now()-raceStartTime)}</div>
    <button onclick="location.reload()">RACE AGAIN</button>
  `;
  ov.style.display='flex';
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function loop(){
  if(!gameRunning) return;

  // Update
  for(const car of cars) car.update(K);

  // Smooth camera follow
  camX += (player.x-camX)*0.08;
  camY += (player.y-camY)*0.08;

  // Clear
  ctx.fillStyle='#1d3d1d';
  ctx.fillRect(0,0,W,H);

  // World transform
  ctx.save();
  ctx.translate(W/2-camX, H/2-camY);
  drawWorld();
  [...cars].sort((a,b)=>a.y-b.y).forEach(c=>c.draw());
  ctx.restore();

  // Screen-space overlays
  drawMinimap();
  updateHUD();

  if(player.finished){
    gameRunning=false;
    setTimeout(showFinish,1600);
    return;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
